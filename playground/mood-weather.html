<style>
/* Layout: full-bleed sky canvas; forecast readout top-left, mood selector docked at the bottom.
   Single look by choice: each mood sets its own sky and ink, so the page ignores the host theme. */
:root {
  --sky-top: #ffb35c;
  --sky-bottom: #ffe3a3;
  --ink: #4a2a06;
  --ink-soft: rgba(74, 42, 6, 0.68);
  --glass: rgba(74, 42, 6, 0.08);
  --glass-strong: rgba(74, 42, 6, 0.16);
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: linear-gradient(var(--sky-top), var(--sky-bottom));
  color: var(--ink);
  font-family: var(--font-display);
  overflow: hidden;
}
canvas#sky { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

.ui {
  position: relative;
  z-index: 1;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px;
  box-sizing: border-box;
  pointer-events: none;
}
.ui > * { pointer-events: auto; }
.wrap { width: 100%; max-width: 1100px; margin: 0 auto; }

.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
.eyebrow {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.readout { display: grid; gap: 6px; max-width: 34rem; min-width: 0; }
.temp-row { display: flex; align-items: flex-start; gap: 18px; flex-wrap: wrap; }
.temp {
  font-weight: 300;
  font-size: clamp(76px, 16vw, 168px);
  line-height: 0.85;
  letter-spacing: -0.04em;
  font-variant-numeric: tabular-nums;
}
.cond { display: grid; gap: 4px; padding-top: 0.6em; }
.cond h1 {
  margin: 0;
  font-weight: 700;
  font-size: clamp(24px, 4vw, 36px);
  letter-spacing: -0.02em;
  text-wrap: balance;
}
.feels { font-family: var(--font-mono); font-size: 13px; color: var(--ink-soft); }
.forecast {
  margin: 10px 0 0;
  font-size: 18px;
  line-height: 1.45;
  max-width: 30ch;
  text-wrap: pretty;
}
.stats {
  margin: 14px 0 0;
  display: grid;
  grid-template-columns: repeat(3, auto);
  justify-content: start;
  gap: 4px 28px;
  font-family: var(--font-mono);
  font-size: 12px;
}
.stats dt { color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.08em; }
.stats dd { margin: 0; font-size: 14px; font-variant-numeric: tabular-nums; }
.stats div { display: grid; gap: 2px; }

.sound {
  flex: none;
  display: inline-flex; align-items: center; gap: 8px;
  font: 500 13px var(--font-mono);
  color: var(--ink);
  background: var(--glass);
  border: 1px solid var(--glass-strong);
  border-radius: 999px;
  padding: 9px 14px;
  cursor: pointer;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.sound:hover { background: var(--glass-strong); }
.sound .bars { display: inline-flex; gap: 2px; align-items: flex-end; height: 12px; }
.sound .bars i { width: 2px; background: currentColor; height: 4px; border-radius: 1px; }
.sound[aria-pressed="true"] .bars i { animation: eq 0.9s ease-in-out infinite alternate; }
.sound[aria-pressed="true"] .bars i:nth-child(2) { animation-delay: -0.3s; }
.sound[aria-pressed="true"] .bars i:nth-child(3) { animation-delay: -0.6s; }
@keyframes eq { from { height: 3px; } to { height: 12px; } }

.bottom { display: grid; gap: 12px; }
.prompt { font-size: 15px; color: var(--ink-soft); margin: 0; }
.moods { display: flex; flex-wrap: wrap; gap: 8px; }
.mood {
  font: 500 15px var(--font-display);
  color: var(--ink);
  background: var(--glass);
  border: 1px solid var(--glass-strong);
  border-radius: 999px;
  padding: 10px 16px 10px 12px;
  display: inline-flex; align-items: center; gap: 10px;
  cursor: pointer;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  transition: background 0.2s, transform 0.2s;
}
.mood:hover { background: var(--glass-strong); transform: translateY(-2px); }
.mood kbd {
  font: 400 11px var(--font-mono);
  color: var(--ink-soft);
  border: 1px solid var(--glass-strong);
  border-radius: 4px;
  padding: 1px 5px;
}
.mood[aria-pressed="true"] { background: var(--ink); color: var(--sky-bottom); border-color: var(--ink); }
.mood[aria-pressed="true"] kbd { color: inherit; border-color: currentColor; opacity: 0.7; }
button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

.swap { transition: opacity 0.45s ease, transform 0.45s ease; }
.swap.out { opacity: 0; transform: translateY(8px); }

@media (max-width: 560px) {
  .stats { grid-template-columns: repeat(2, auto); }
  .forecast { font-size: 16px; }
  .mood kbd { display: none; }
  .sound .label { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .swap, .mood { transition: none; }
}
.back {
  position: fixed; z-index: 2; top: max(14px, env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
  font: 500 12px var(--font-mono); letter-spacing: .04em; color: var(--ink); text-decoration: none;
  background: var(--glass); border: 1px solid var(--glass-strong); border-radius: 999px; padding: 7px 12px;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.back:hover { background: var(--glass-strong); }
</style>

<script>
(() => {
  const MOODS = [
    { id: "happy",    label: "Happy",    kind: "sun",
      top: "#ffb35c", bottom: "#ffe3a3", ink: "#4a2a06",
      temp: "31°", cond: "Clear skies", feels: "Feels like 34°",
      wind: "6 km/h", vis: "20 km", pres: "1024 hPa",
      forecast: "Bright all day. A good time to call someone you like." },
    { id: "low",      label: "Low",      kind: "rain",
      top: "#33465a", bottom: "#7f97ab", ink: "#f2f6fa",
      temp: "14°", cond: "Steady rain", feels: "Feels like 11°",
      wind: "12 km/h SW", vis: "4 km", pres: "1002 hPa",
      forecast: "Easing tonight. Stay in, make chai, go slow." },
    { id: "foggy",    label: "Foggy",    kind: "fog",
      top: "#aeb2b6", bottom: "#e3e2dd", ink: "#2c2f33",
      temp: "9°", cond: "Dense fog", feels: "Feels like 7°",
      wind: "2 km/h", vis: "200 m", pres: "1013 hPa",
      forecast: "Lifting by late morning. Do one small thing at a time." },
    { id: "angry",    label: "Angry",    kind: "storm",
      top: "#110f18", bottom: "#3a3147", ink: "#f4eefc",
      temp: "27°", cond: "Thunderstorm", feels: "Feels like 31°",
      wind: "Gusts 58 km/h", vis: "1.5 km", pres: "989 hPa",
      forecast: "Passes quickly. Walk it off before you reply to anyone." },
    { id: "calm",     label: "Calm",     kind: "snow",
      top: "#9fbbd6", bottom: "#eef3f8", ink: "#1b2a3a",
      temp: "−2°", cond: "Light snow", feels: "Feels like −5°",
      wind: "4 km/h", vis: "8 km", pres: "1030 hPa",
      forecast: "Quiet and steady. Nothing needs you right now." },
    { id: "restless", label: "Restless", kind: "wind",
      top: "#5f7b6b", bottom: "#c9d4b8", ink: "#16231a",
      temp: "18°", cond: "Gusty winds", feels: "Feels like 15°",
      wind: "Gusts 45 km/h", vis: "10 km", pres: "998 hPa",
      forecast: "Settling by evening. Breathe out longer than you breathe in." },
  ];

  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const root = document.documentElement;
  const $ = (id) => document.getElementById(id);

  // ---------- date ----------
  try {
    const d = new Date();
    $("date").textContent = "Inner forecast · " + d.toLocaleDateString("en-IN", { weekday: "short", day: "numeric", month: "short" });
  } catch (e) {}

  // ---------- colour helpers ----------
  const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
  const rgb = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
  const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

  // ---------- canvas ----------
  const cv = $("sky");
  const ctx = cv.getContext("2d");
  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  addEventListener("resize", resize);
  resize();

  const pointer = { x: -999, y: -999 };
  addEventListener("pointermove", (e) => { pointer.x = e.clientX; pointer.y = e.clientY; });
  addEventListener("pointerleave", () => { pointer.x = pointer.y = -999; });

  const rand = (a, b) => a + Math.random() * (b - a);
  const density = reduced ? 0.35 : 1;
  const area = () => Math.max(0.5, (W * H) / (1280 * 800));

  function push(p, radius, strength) {
    const dx = p.x - pointer.x, dy = p.y - pointer.y;
    const d2 = dx * dx + dy * dy;
    if (d2 < radius * radius && d2 > 1) {
      const d = Math.sqrt(d2), f = (1 - d / radius) * strength;
      p.x += (dx / d) * f; p.y += (dy / d) * f * 0.4;
    }
  }

  // shared signals between the weather and the character
  const world = { boltAt: 0, shelter: null, gust: 0 };

  // ---------- weather layers ----------
  const Layers = {
    sun() {
      const motes = Array.from({ length: Math.round(60 * area() * density) }, () => ({
        x: rand(0, W), y: rand(0, H), r: rand(1, 3), v: rand(0.15, 0.5), p: rand(0, 6.28) }));
      let t = 0;
      return {
        update(dt) {
          t += dt;
          for (const m of motes) {
            m.y -= m.v * dt * 60 * 0.4; m.x += Math.sin(t * 0.6 + m.p) * 0.3;
            push(m, 110, 3);
            if (m.y < -10) { m.y = H + 10; m.x = rand(0, W); }
          }
        },
        draw(a) {
          const cx = W * 0.8, cy = H * 0.24, R = Math.min(W, H) * 0.12;
          const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 5);
          g.addColorStop(0, `rgba(255,248,220,${0.95 * a})`);
          g.addColorStop(0.18, `rgba(255,214,120,${0.55 * a})`);
          g.addColorStop(1, "rgba(255,200,100,0)");
          ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
          ctx.save(); ctx.translate(cx, cy); ctx.rotate(reduced ? 0 : t * 0.05);
          ctx.globalAlpha = 0.18 * a; ctx.fillStyle = "#fff6d8";
          for (let i = 0; i < 14; i++) {
            ctx.rotate(Math.PI * 2 / 14);
            ctx.beginPath(); ctx.moveTo(R * 1.2, -R * 0.12); ctx.lineTo(R * 4.2, 0); ctx.lineTo(R * 1.2, R * 0.12); ctx.fill();
          }
          ctx.restore();
          ctx.globalAlpha = a; ctx.fillStyle = "#fffbea";
          ctx.beginPath(); ctx.arc(cx, cy, R * 0.75 + Math.sin(t * 1.4) * 2, 0, 7); ctx.fill();
          for (const m of motes) {
            ctx.globalAlpha = a * (0.35 + 0.35 * Math.sin(t * 2 + m.p));
            ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, 7); ctx.fill();
          }
          ctx.globalAlpha = 1;
        },
      };
    },

    rain(heavy = false) {
      const n = Math.round((heavy ? 420 : 240) * area() * density);
      const drops = Array.from({ length: n }, () => ({
        x: rand(-100, W + 100), y: rand(-H, H), len: rand(10, heavy ? 28 : 20),
        v: rand(heavy ? 14 : 9, heavy ? 22 : 15), w: rand(0.6, 1.4) }));
      const rings = [];
      const slant = heavy ? 0.28 : 0.1;
      return {
        update(dt) {
          const k = dt * 60;
          for (const d of drops) {
            d.y += d.v * k; d.x += d.v * slant * k;
            push(d, 90, 5);
            const sh = world.shelter;
            if (sh) {
              const u = (d.x - sh.x) / sh.r;
              if (Math.abs(u) < 1) {
                const domeY = sh.y - sh.h * Math.sqrt(1 - u * u);
                if (d.y > domeY && d.y < sh.y + 12) {
                  if (rings.length < 80 && Math.random() < 0.6) rings.push({ x: d.x, y: domeY, r: 1, life: 0.7 });
                  d.y = rand(-60, -10); d.x = rand(-100, W); continue;
                }
              }
            }
            if (d.y > H - rand(0, 40)) {
              if (rings.length < 80 && Math.random() < 0.3) rings.push({ x: d.x, y: d.y, r: 1, life: 1 });
              d.y = rand(-60, -10); d.x = rand(-100, W);
            }
          }
          for (let i = rings.length - 1; i >= 0; i--) {
            const r = rings[i]; r.r += 0.6 * k; r.life -= 0.04 * k;
            if (r.life <= 0) rings.splice(i, 1);
          }
        },
        draw(a) {
          ctx.strokeStyle = heavy ? "rgba(210,205,240,0.55)" : "rgba(225,236,246,0.6)";
          ctx.lineCap = "round";
          ctx.globalAlpha = a;
          for (const d of drops) {
            ctx.lineWidth = d.w;
            ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - d.len * slant, d.y - d.len); ctx.stroke();
          }
          ctx.lineWidth = 1;
          for (const r of rings) {
            ctx.globalAlpha = a * r.life * 0.5;
            ctx.beginPath(); ctx.ellipse(r.x, r.y, r.r * 2, r.r * 0.6, 0, 0, 7); ctx.stroke();
          }
          ctx.globalAlpha = 1;
        },
      };
    },

    storm() {
      const rain = Layers.rain(true);
      let flash = 0, next = rand(1.5, 4), bolt = null;
      function makeBolt() {
        const pts = [[rand(W * 0.15, W * 0.85), 0]];
        let [x, y] = pts[0];
        while (y < H * rand(0.55, 0.85)) { x += rand(-40, 40); y += rand(20, 50); pts.push([x, y]); }
        return pts;
      }
      return {
        update(dt) {
          rain.update(dt);
          next -= dt; flash = Math.max(0, flash - dt * 2.4);
          if (next <= 0) {
            next = rand(2.5, 6); flash = 1; bolt = reduced ? null : makeBolt();
            world.boltAt = performance.now();
            Audio.thunder();
          }
        },
        draw(a) {
          rain.draw(a);
          if (flash > 0) {
            const f = reduced ? flash * 0.3 : flash;
            ctx.fillStyle = `rgba(230,220,255,${0.35 * f * f * a})`;
            ctx.fillRect(0, 0, W, H);
            if (bolt && flash > 0.55) {
              ctx.strokeStyle = `rgba(250,245,255,${a})`; ctx.lineWidth = 2.5;
              ctx.shadowColor = "#cbb8ff"; ctx.shadowBlur = 24;
              ctx.beginPath(); bolt.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.stroke();
              ctx.shadowBlur = 0;
            }
          }
        },
      };
    },

    snow() {
      const flakes = Array.from({ length: Math.round(220 * area() * density) }, () => ({
        x: rand(0, W), y: rand(-H, H), r: rand(1, 4), v: rand(0.3, 1.1), p: rand(0, 6.28) }));
      let t = 0;
      return {
        update(dt) {
          t += dt; const k = dt * 60;
          for (const f of flakes) {
            f.y += f.v * k; f.x += Math.sin(t * 0.8 + f.p) * 0.4 * k;
            push(f, 120, 4);
            if (f.y > H + 10) { f.y = -10; f.x = rand(0, W); }
          }
        },
        draw(a) {
          ctx.fillStyle = "#ffffff";
          for (const f of flakes) {
            ctx.globalAlpha = a * (0.45 + f.r / 8);
            ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 7); ctx.fill();
          }
          ctx.globalAlpha = 1;
        },
      };
    },

    fog() {
      const banks = Array.from({ length: 9 }, (_, i) => ({
        x: rand(-0.2, 1.2), y: 0.15 + (i / 9) * 0.85, r: rand(0.35, 0.7), v: rand(0.004, 0.012) * (i % 2 ? 1 : -1) }));
      let t = 0;
      return {
        update(dt) {
          t += dt;
          for (const b of banks) {
            b.x += b.v * dt * (reduced ? 0.3 : 1);
            if (b.x > 1.6) b.x = -0.6; if (b.x < -0.6) b.x = 1.6;
          }
        },
        draw(a) {
          const s = Math.max(W, H);
          for (const b of banks) {
            let x = b.x * W, y = b.y * H;
            const dx = x - pointer.x, dy = y - pointer.y, d = Math.hypot(dx, dy);
            if (d < 260 && d > 1) { x += (dx / d) * (260 - d) * 0.3; y += (dy / d) * (260 - d) * 0.15; }
            const g = ctx.createRadialGradient(x, y, 0, x, y, b.r * s);
            g.addColorStop(0, `rgba(245,244,240,${0.55 * a})`);
            g.addColorStop(1, "rgba(245,244,240,0)");
            ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
          }
          // pointer clears a pocket of visibility
          if (pointer.x > -900) {
            const g = ctx.createRadialGradient(pointer.x, pointer.y, 0, pointer.x, pointer.y, 140);
            g.addColorStop(0, `rgba(255,255,255,${0.1 * a})`); g.addColorStop(1, "rgba(255,255,255,0)");
            ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
          }
        },
      };
    },

    wind() {
      const streaks = Array.from({ length: Math.round(90 * area() * density) }, () => ({
        x: rand(-W, W), y: rand(0, H), len: rand(60, 220), v: rand(8, 18), p: rand(0, 6.28) }));
      const leaves = Array.from({ length: Math.round(26 * area() * density) }, () => ({
        x: rand(-W, W), y: rand(0, H), s: rand(5, 10), v: rand(5, 11), rot: rand(0, 6.28), spin: rand(-0.15, 0.15), p: rand(0, 6.28) }));
      let t = 0;
      return {
        update(dt) {
          t += dt; const k = dt * 60;
          const gust = 1 + 0.6 * Math.max(0, Math.sin(t * 0.9));
          world.gust = gust - 1;
          for (const s of streaks) {

  // ---------- state & transitions ----------

  let col = from;

  function applyColors(c) {

    root.style.setProperty("--sky-bottom", rgb(c.bottom));
    root.style.setProperty("--ink", rgb(ink));

  }

  // ---------- Badal, the little character ----------
  const Buddy = (() => {
    const LINES = {
      sun:   ["Sunglasses on. Good day.", "Let's go outside!", "I could do this forever."],
      rain:  ["I brought an umbrella.", "Chai and a window seat?", "It's okay to be slow today."],
      fog:   ["Five more minutes…", "Where did everything go?", "One thing at a time."],
      storm: ["Don't talk to me right now.", "Grr. Okay. Breathing.", "That one was loud."],
      snow:  ["So quiet. I like it.", "Warm scarf, warm heart.", "Shh. Listen."],
      wind:  ["Hold on, hold on…", "My hair! My hair!", "Steady… steady…"],
    };
    const BODY = { sun: "#fff4e2", rain: "#eef3f8", fog: "#f3f2ee", storm: "#ffb9a8", snow: "#fdfdff", wind: "#f4f7ec" };
    const footer = document.querySelector("footer");

    let t = 0, y = 0, vy = 0, squash = 0, slide = 0, startle = 0;
    let nextBlink = 2, blinkT = 0, hopT = 1.5, lastBolt = 0, puffT = 0, lineIdx = {};
    let bubble = null, bubbleAt = 1.0, bubbleText = "Hi, I'm Badal. Tap me!";
    const puffs = [];
    let G = { R: 36, cx: 0, gy: 0 };

    function geom() {
      const R = W < 560 ? 28 : 36;
      let top = H - 140;
      try { top = footer.getBoundingClientRect().top; } catch (e) {}
      G = { R, cx: W - Math.max(70, W * 0.16), gy: top - 10 };
      return G;
    }
    const center = () => ({ x: G.cx + slide, y: G.gy - y - G.R * 0.95 });

    function say(text, delay = 0) { bubbleText = text; bubbleAt = t + delay; bubble = null; }
    function nextLine(k) {
      const list = LINES[k]; const i = (lineIdx[k] = ((lineIdx[k] ?? -1) + 1) % list.length);
      return list[i];
    }
    function change(k) {
      pending = k;
      if (reduced) { kind = k; pending = null; } else if (y === 0) vy = 6.5;
      puffs.length = 0;

    function poke() {

    }

        else if (kind === "storm") { const s = Math.random() < 0.5 ? -1 : 1;

        else if (kind === "fog") { puffs.push({ x: R * 0.6, y: -R * 0.9, vx: 0.35, vy: -0.45, r: 10, life: 1, type: "z" }); puffT = 1.3; }

      } else world.shelter = null;

    function drawEyes(R, ink, body) {
      const c = center();
      let lx = 0, ly = 0;

        const dx = pointer.x - c.x, dy = pointer.y - c.y, d = Math.hypot(dx, dy) || 1;

    }

    function drawMouth(R, ink) {
      ctx.strokeStyle = ink; ctx.fillStyle = ink; ctx.lineWidth = 2.4;
      const my = R * 0.22;

        ctx.fillStyle = "#ff8f8f"; ctx.beginPath(); ctx.arc(0, my + R * 0.09, R * 0.08, Math.PI, 0); ctx.fill();

        ctx.beginPath(); ctx.arc(0, my + R * 0.12, R * 0.12, 1.2 * Math.PI, 1.8 * Math.PI); ctx.stroke();
      } else if (kind === "fog") {
        const yawn = Math.max(0, Math.sin(((t % 7) / 7) * Math.PI * 2 - 4.2));
        if (yawn > 0.05 && !reduced) { ctx.beginPath(); ctx.ellipse(0, my, R * 0.09, R * 0.05 + yawn * R * 0.14, 0, 0, 7); ctx.fill(); }

    function draw() {
      const { R, cx, gy } = G;

      ctx.save();

      ctx.beginPath(); ctx.ellipse(0, 2, R * Math.max(0.4, 0.9 - y * 0.006), R * 0.16, 0, 0, 7); ctx.fill();

      }

      const flap = kind === "wind" ? 0.9 + world.gust + Math.sin(t * 14) * 0.15 : Math.sin(t * 1.5) * 0.15;
      for (const o of [-0.12, 0, 0.12]) {
        ctx.beginPath(); ctx.moveTo(o * R, -R * 0.9);

        for (const s of [-1, 1]) { ctx.beginPath(); ctx.ellipse(s * R * 0.58, R * 0.1, R * 0.13, R * 0.08, 0, 0, 7); ctx.fill(); }

      if (kind === "snow") {
        ctx.fillStyle = "#4f74b8";
        ctx.beginPath(); ctx.ellipse(0, -R * 0.62, R * 0.78, R * 0.6, 0, Math.PI, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.fillStyle = "#e9eef7";
        ctx.beginPath(); ctx.roundRect(-R * 0.84, -R * 0.7, R * 1.68, R * 0.2, R * 0.1); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.arc(0, -R * 1.25, R * 0.16, 0, 7); ctx.fill(); ctx.stroke();
        ctx.fillStyle = "#d9534f";
        ctx.beginPath(); ctx.roundRect(-R * 0.78, R * 0.26, R * 1.56, R * 0.24, R * 0.12); ctx.fill(); ctx.stroke();
        const sway = reduced ? 0 : Math.sin(t * 1.8) * 0.12;
        ctx.save(); ctx.translate(R * 0.45, R * 0.42); ctx.rotate(sway);
        ctx.beginPath(); ctx.roundRect(-R * 0.1, 0, R * 0.22, R * 0.55, R * 0.06); ctx.fill(); ctx.stroke();
        ctx.restore();
      }

      // puffs
      for (const p of puffs) {
        ctx.globalAlpha = Math.max(0, p.life) * (p.type === "steam" ? 0.6 : 0.8);
        if (p.type === "z") {
          ctx.fillStyle = ink; ctx.font = `600 ${Math.round(p.r)}px ${getComputedStyle(root).getPropertyValue("--font-display")}`;
          ctx.fillText("z", p.x, p.y);
        } else {
          ctx.fillStyle = p.type === "steam" ? "#fbeee9" : "#ffffff";
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
        }
      }
      ctx.globalAlpha = 1;
      ctx.restore();

      if (bubble) drawBubble(R, cx + slide, gy - y);
    }

    function drawBubble(R, bx, by) {
      const fade = Math.min(1, (bubble.until - t) / 0.4, (t - (bubble.until - 3.2)) / 0.25);
      ctx.save();
      ctx.globalAlpha = Math.max(0, fade);
      ctx.font = `500 15px ${getComputedStyle(root).getPropertyValue("--font-display")}`;
      const tw = ctx.measureText(bubble.text).width, pw = 14, ph = 34;
      const top = by - R * (kind === "rain" ? 3.45 : 2.55) - ph - 10;
      let x = bx - tw / 2 - pw;
      x = Math.max(16, Math.min(W - 16 - tw - pw * 2, x));
      ctx.fillStyle = rgb(col.ink);
      ctx.beginPath(); ctx.roundRect(x, top, tw + pw * 2, ph, 17); ctx.fill();
      const tx = Math.max(x + 18, Math.min(x + tw + pw * 2 - 18, bx));
      ctx.beginPath(); ctx.moveTo(tx - 7, top + ph - 1); ctx.lineTo(tx, top + ph + 8); ctx.lineTo(tx + 7, top + ph - 1); ctx.fill();
      ctx.fillStyle = rgb(col.bottom); ctx.textBaseline = "middle";
      ctx.fillText(bubble.text, x + pw, top + ph / 2 + 1);
      ctx.restore();
    }

    return { update, draw, change, poke, hit };
  })();

  cv.addEventListener("pointerdown", (e) => { if (Buddy.hit(e.clientX, e.clientY)) Buddy.poke(); });
  addEventListener("pointermove", (e) => { cv.style.cursor = Buddy.hit(e.clientX, e.clientY) ? "pointer" : ""; });

  const swap = $("swap");
  function setReadout(m) {
    $("temp").textContent = m.temp; $("cond").textContent = m.cond; $("feels").textContent = m.feels;
    $("forecast").textContent = m.forecast; $("wind").textContent = m.wind; $("vis").textContent = m.vis; $("pres").textContent = m.pres;
  }

  function select(m) {
    if (m === active) return;
    active = m;
    from = col; to = { top: hex(m.top), bottom: hex(m.bottom), ink: hex(m.ink) }; tStart = performance.now();
    layers.forEach((l) => (l.target = 0));
    layers.push({ sys: Layers[m.kind](), alpha: 0, target: 1 });
    document.querySelectorAll(".mood").forEach((b) => b.setAttribute("aria-pressed", b.dataset.id === m.id));
    if (reduced) setReadout(m);
    else { swap.classList.add("out"); setTimeout(() => { setReadout(m); swap.classList.remove("out"); }, 450); }
    Audio.play(m.kind);
    Buddy.change(m.kind);
  }

  const moodsEl = $("moods");
  MOODS.forEach((m, i) => {
    const b = document.createElement("button");
    b.className = "mood"; b.type = "button"; b.dataset.id = m.id; b.id = "mood-" + m.id;
    b.setAttribute("aria-pressed", m === active);
    b.innerHTML = `<kbd>${i + 1}</kbd>${m.label}`;
    b.addEventListener("click", () => select(m));
    moodsEl.appendChild(b);
  });
  addEventListener("keydown", (e) => {
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= MOODS.length && !e.metaKey && !e.ctrlKey) select(MOODS[n - 1]);
  });

  const soundBtn = $("sound");
  soundBtn.addEventListener("click", async () => {
    const on = await Audio.toggle(active.kind);
    soundBtn.setAttribute("aria-pressed", on);
    soundBtn.querySelector(".label").textContent = on ? "Sound on" : "Sound off";
  });

  // ---------- loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    const p = ease(Math.min(1, (now - tStart) / 1000 / TDUR));
    col = { top: mix(from.top, to.top, p), bottom: mix(from.bottom, to.bottom, p), ink: mix(from.ink, to.ink, p) };
    applyColors(col);

    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, rgb(col.top)); g.addColorStop(1, rgb(col.bottom));
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    for (const l of layers) {
      l.alpha += (l.target - l.alpha) * Math.min(1, dt * (reduced ? 20 : 2.2));
      l.sys.update(dt); l.sys.draw(l.alpha);
    }
    layers = layers.filter((l) => l.target > 0 || l.alpha > 0.01);
    Buddy.update(dt); Buddy.draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

</body></html>
